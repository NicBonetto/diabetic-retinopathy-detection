[project]
name = "dr-detection"
version = "0.1.0"
description = "Automated detection and grading of diabetic retinopathy from retinal fundus images."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nico Bonetto", email = "nbonetto@berkeley.edu" }]
keywords = ["deep-learning", "medical-imaging", "diabetic-retinopathy", "pytorch"]

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    # numpy is held below 2.0 to match the original pin; revisit once the
    # albumentations / grad-cam stack is confirmed working on numpy 2.x.
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "pillow>=10.0",
    "albumentations>=1.4",
    # cv2 is used directly in utils/visualizations.py. The headless build is
    # chosen deliberately: albumentations already depends on it, and installing
    # opencv-python alongside it puts two cv2 modules on the path.
    "opencv-python-headless>=4.9",
    "grad-cam>=1.5",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.scripts]
dr-preprocess = "dr_detection.cli.preprocess:main"
dr-train = "dr_detection.cli.train:main"
dr-evaluate = "dr_detection.cli.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_detection"]

# ---------------------------------------------------------------------------
# torch resolution
#
# macOS and Windows take the default PyPI wheel; on macOS that is the build
# with MPS support, which is what you want on Apple Silicon.
# Linux takes the CUDA 12.4 index, since that is where training actually runs.
# Change the index name below to match a different CUDA version if needed.
# ---------------------------------------------------------------------------
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E501 (line length) and the UP modernization rules are deliberately left out:
# both would rewrite large amounts of otherwise-working code for style alone.
select = ["E4", "E7", "E9", "F", "I", "B"]
